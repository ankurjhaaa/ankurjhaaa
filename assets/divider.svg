<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 20" width="100%" height="20">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0" />
      <stop offset="50%" stop-color="#2563EB" stop-opacity="1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="100" y="9" width="600" height="2" fill="url(#line)" filter="url(#neon)"/>
  <circle cx="400" cy="10" r="4" fill="#FFFFFF" filter="url(#neon)"/>
</svg>
